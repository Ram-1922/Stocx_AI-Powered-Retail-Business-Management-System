<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocx - CRM & Customers</title>
    
    <link rel="icon" href="/static/icons/verify_3199586.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#ecfdf5', 100: '#d1fae5', 400: '#34d399', 500: '#10b981', 600: '#059669', 900: '#064e3b' },
                        accent: { 500: '#14b8a6', 600: '#0d9488' }
                    }
                }
            }
        }
    </script>
    <style>
        body { margin: 0; overflow-x: hidden; transition: background-color 0.3s, color 0.3s; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }
        
        /* Glassmorphism */
        .glass-card { background: var(--bg-glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border-glass); }
        :root { --bg-base: #f8fafc; --bg-glass: rgba(255, 255, 255, 0.75); --border-glass: rgba(16, 185, 129, 0.2); }
        .dark { --bg-base: #020617; --bg-glass: rgba(15, 23, 42, 0.75); --border-glass: rgba(16, 185, 129, 0.15); }

        /* Radial Backgrounds */
        .radial-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -10; background: radial-gradient(circle at 15% 50%, rgba(16, 185, 129, 0.08), transparent 40%), radial-gradient(circle at 85% 30%, rgba(20, 184, 166, 0.08), transparent 40%); }
        button, p, a, nav, h1, h2, h3, label, .btn-action, .close-btn {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* Ensure users can still select and copy text inside inputs and tables (like Invoice IDs) */
        input, textarea, select, td {
            -webkit-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }
    </style>
</head>
<body class="bg-[var(--bg-base)] text-slate-800 dark:text-slate-100 antialiased min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

    <div class="radial-bg"></div>
    <div class="fixed top-[-10%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-brand-400/20 dark:bg-brand-900/20 blur-[120px] pointer-events-none -z-10"></div>
    <div class="fixed bottom-[-10%] left-[-10%] w-[40vw] h-[40vw] rounded-full bg-accent-400/15 dark:bg-accent-900/20 blur-[120px] pointer-events-none -z-10"></div>

    <nav class="sticky top-0 z-40 w-full glass-card border-b transition-all duration-300 shadow-sm">
        <div class="max-w-[1600px] mx-auto px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center gap-6">
                    <a href="/" class="group flex items-center gap-2 px-4 py-2 bg-slate-100/50 dark:bg-slate-800/50 rounded-xl hover:bg-brand-50 dark:hover:bg-brand-900/30 border border-slate-200 dark:border-slate-700 hover:border-brand-300 transition-all">
                        <span class="text-brand-500 group-hover:-translate-x-1 transition-transform"><--</span>
                        <span class="text-sm font-bold text-slate-600 dark:text-slate-300 group-hover:text-brand-600 dark:group-hover:text-brand-400">Dashboard</span>
                    </a>
                    <div class="h-6 w-px bg-slate-300 dark:bg-slate-700"></div>
                    <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-brand-600 to-accent-500 flex items-center gap-3">
                        <span class="text-2xl"><img class="w-8 h-8" src="static/icons/customer.png"/></span> CRM & Customers
                    </h1>
                </div>
                
                <button id="themeToggle" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100/50 dark:bg-slate-800/50 text-slate-500 hover:text-brand-500 border border-slate-200 dark:border-slate-700 transition-all hover:scale-105" title="Press 'D' to toggle">
                    <svg class="w-5 h-5 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    <svg class="w-5 h-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-[1600px] mx-auto px-6 lg:px-8 py-10 w-full relative z-10 flex flex-col gap-8">
        
        <div class="glass-card rounded-[2rem] flex flex-col flex-grow overflow-hidden shadow-lg mb-8">
            
            <div class="p-6 border-b border-slate-200/50 dark:border-slate-700/50 bg-white/30 dark:bg-slate-800/30 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800 dark:text-white">Customer Database</h2>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Manage relationships and track lifetime value.</p>
                </div>
                
                <div class="flex flex-wrap items-center gap-3 w-full xl:w-auto">
                    <div class="relative group flex-grow sm:flex-grow-0 min-w-[250px]">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><img class="w-5 h-5" src="static/icons/magnifying-glass.png"/></span>
                        <input type="text" id="crmSearchInput" placeholder="Search by name, phone, or area..." class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/80 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-700 text-sm focus:ring-2 focus:ring-brand-500/40 focus:border-brand-500 outline-none transition-all shadow-sm group-hover:border-brand-300">
                    </div>
                    
                    <select id="crmSortSelect" class="pl-9 pr-10 py-2.5 rounded-xl bg-white/80 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-700 text-sm font-bold text-slate-700 dark:text-slate-300 focus:ring-2 focus:ring-brand-500/40 focus:border-brand-500 outline-none transition-all shadow-sm cursor-pointer hover:border-brand-300 appearance-none min-w-[160px]">
                        <option value="value-desc">Sort: Highest Value</option>
                        <option value="newest">Sort: Newest First</option>
                        <option value="oldest">Sort: Oldest First</option>
                        <option value="name-asc">Sort: Name (A-Z)</option>
                    </select>

                    <select id="crmFilterSelect" class="pl-9 pr-10 py-2.5 rounded-xl bg-white/80 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-700 text-sm font-bold text-slate-700 dark:text-slate-300 focus:ring-2 focus:ring-brand-500/40 focus:border-brand-500 outline-none transition-all shadow-sm cursor-pointer hover:border-brand-300 appearance-none w-full sm:w-auto">
                        <option value="all">All Customers</option>
                        <option value="new">New Customers</option>
                        <option value="regular">Regular Customers</option>
                        <option value="top5">Top 5 by Value</option>
                    </select>

                    <button id="manualAddBtn" onclick="openCrmAddModal()" class="px-6 py-3 bg-gradient-to-r from-brand-500 to-accent-500 text-white text-sm font-bold rounded-xl shadow-md shadow-brand-500/30 hover:shadow-[0_0_20px_rgba(16,185,129,0.4)] hover:-translate-y-0.5 active:scale-95 transition-all flex items-center gap-2 whitespace-nowrap">
                        <span><img class="w-8 h-6" src="static/icons/new-account.png"/></span> Add Customer
                    </button>
                </div>
            </div>

            <div class="px-4 pb-6 overflow-x-auto max-h-[70vh] mt-2 relative ">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead class="sticky top-0 z-20 bg-white dark:bg-slate-900 shadow-sm border-b border-slate-200 dark:border-slate-700">
                        <tr class="text-[11px] font-extrabold text-slate-500 dark:text-slate-400 uppercase tracking-widest">
                            <th class="px-6 py-5 rounded-tl-xl">Customer Name</th>
                            <th class="px-6 py-5">Phone Number</th>
                            <th class="px-6 py-5">Area / City</th>
                            <th class="px-6 py-5 text-center">Tenure (Age)</th>
                            <th class="px-6 py-5 text-right">Lifetime Value</th>
                            <th class="px-6 py-5 text-center rounded-tr-xl">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="customerTableBody" class="divide-y divide-slate-100 dark:divide-slate-800/60 text-sm font-medium text-slate-700 dark:text-slate-300">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="newCustomerModal" class="hidden fixed inset-0 bg-slate-900/60 dark:bg-black/80 backdrop-blur-md z-[150] flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border border-slate-200 dark:border-slate-700 rounded-[2rem] shadow-2xl w-full max-w-md p-8 transform transition-all duration-300 scale-95">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-blue-500/20 text-blue-500 flex items-center justify-center text-xl shadow-inner"><img class="w-6 h-6" src="static/icons/new-account.png"/></div>
                    <h3 class="text-2xl font-extrabold text-slate-800 dark:text-white">Add Customer</h3>
                </div>
                <button id="ncCancelX" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:bg-rose-100 hover:text-rose-500 flex items-center justify-center transition-all active:scale-90">✕</button>
            </div>
            
            <div class="space-y-4">
                <div class="group">
                    <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-1.5 group-focus-within:text-brand-500 transition-colors">Full Name *</label>
                    <input type="text" id="ncName" placeholder="e.g. John Doe" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:ring-2 focus:ring-brand-500/40 outline-none transition-all">
                </div>
                <div class="group">
                    <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-1.5 group-focus-within:text-brand-500 transition-colors">Phone Number *</label>
                    <div class="flex gap-2">
                        <select id="ncCountryCode" class="w-1/3 px-3 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-bold focus:ring-2 focus:ring-brand-500/40 outline-none cursor-pointer">
                            <option value="+91" data-max="10">🇮🇳 +91</option>
                            <option value="+1" data-max="10">🇺🇸 +1</option>
                            <option value="+44" data-max="10">🇬🇧 +44</option>
                        </select>
                        <input type="text" id="ncPhone" placeholder="Number..." class="w-2/3 px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:ring-2 focus:ring-brand-500/40 outline-none transition-all font-bold tracking-wider" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')" autocomplete="off">
                    </div>
                </div>
                <div class="group">
                    <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-1.5 group-focus-within:text-brand-500 transition-colors">Area / City</label>
                    <input type="text" id="ncArea" placeholder="Optional" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:ring-2 focus:ring-brand-500/40 outline-none transition-all">
                </div>
            </div>
            
            <div class="mt-8 flex justify-end gap-3">
                <button id="ncCancelBtn" class="px-6 py-3.5 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-bold rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-all active:scale-95">Cancel</button>
                <button id="ncSaveBtn" class="px-6 py-3.5 bg-brand-500 text-white font-bold rounded-xl shadow-md hover:shadow-lg hover:-translate-y-0.5 active:scale-95 transition-all">Save Customer</button>
            </div>
        </div>
    </div>

    <div id="editCustomerModal" class="hidden fixed inset-0 bg-slate-900/60 dark:bg-black/80 backdrop-blur-md z-[150] flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border border-slate-200 dark:border-slate-700 rounded-[2rem] shadow-2xl w-full max-w-md p-8 transform transition-all duration-300 scale-95">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-10 h-10 rounded-xl bg-brand-500/20 text-brand-500 flex items-center justify-center text-xl shadow-inner">✏️</div>
                <h3 class="text-2xl font-extrabold text-slate-800 dark:text-white">Edit Customer</h3>
            </div>
            <p class="text-sm font-medium text-slate-500 dark:text-slate-400 mb-6">Update customer details below.</p>
            
            <input type="hidden" id="editCustPhoneOriginal">
            
            <div class="space-y-4">
                <div class="group">
                    <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-1.5 group-focus-within:text-brand-500 transition-colors">Full Name *</label>
                    <input type="text" id="editCustName" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:ring-2 focus:ring-brand-500/40 outline-none transition-all">
                </div>
                <div class="group">
                    <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-1.5 group-focus-within:text-brand-500 transition-colors">Phone Number *</label>
                    <div class="flex gap-2">
                        <select id="editCustCountryCode" class="w-1/3 px-3 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-bold focus:ring-2 focus:ring-brand-500/40 outline-none cursor-pointer">
                            <option value="+91" data-max="10">🇮🇳 +91</option>
                            <option value="+1" data-max="10">🇺🇸 +1</option>
                            <option value="+44" data-max="10">🇬🇧 +44</option>
                        </select>
                        <input type="text" id="editCustPhone" class="w-2/3 px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:ring-2 focus:ring-brand-500/40 outline-none transition-all font-bold tracking-wider" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')" autocomplete="off">
                    </div>
                </div>
                <div class="group">
                    <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-1.5 group-focus-within:text-brand-500 transition-colors">Area / City</label>
                    <input type="text" id="editCustArea" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:ring-2 focus:ring-brand-500/40 outline-none transition-all">
                </div>
            </div>
            
            <div class="mt-8 flex justify-end gap-3">
                <button id="editCustCancelBtn" class="px-6 py-3.5 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-bold rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-all active:scale-95">Cancel</button>
                <button id="editCustSaveBtn" class="px-6 py-3.5 bg-brand-500 text-white font-bold rounded-xl shadow-md hover:shadow-lg hover:-translate-y-0.5 active:scale-95 transition-all">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="historyModal" class="hidden fixed inset-0 bg-slate-900/60 dark:bg-black/80 backdrop-blur-md z-[150] flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl border border-slate-200 dark:border-slate-700 rounded-[2rem] shadow-2xl w-full max-w-2xl overflow-hidden transform transition-all duration-300 scale-95">
            <div class="px-8 py-6 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/50">
                <h3 id="historyModalTitle" class="text-2xl font-extrabold text-slate-800 dark:text-white">Purchase History</h3>
                <button id="closeHistoryBtn" class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-500 hover:bg-rose-100 hover:text-rose-500 flex items-center justify-center transition-all active:scale-90">✕</button>
            </div>
            
            <div class="p-8 max-h-[60vh] overflow-y-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="text-slate-500 dark:text-slate-400 uppercase tracking-wider text-[11px] font-bold border-b border-slate-200 dark:border-slate-700">
                            <th class="pb-3 px-4">Date</th>
                            <th class="pb-3 px-4 text-center">Invoice #</th>
                            <th class="pb-3 px-4 text-right">Amount Paid</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody" class="divide-y divide-slate-100 dark:divide-slate-800/50">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        function setTheme(theme) {
            if (theme === 'dark') { document.documentElement.classList.add('dark'); localStorage.theme = 'dark'; } 
            else { document.documentElement.classList.remove('dark'); localStorage.theme = 'light'; }
        }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) setTheme('dark');
        themeToggleBtn.addEventListener('click', () => setTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark'));
        window.addEventListener('keydown', (e) => {
            if (e.defaultPrevented || e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
            if (e.key.toLowerCase() !== 'd') return;
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
            setTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
        });
    </script>
    <script src="/static/js/customers.js"></script>
</body>
</html>
